name: Tests

on: [push, pull_request]

jobs:
  unit_tests:
    name: unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
        # include:
        #   - os: ubuntu-22.04
        #     install-rg: sudo apt-get update && sudo apt-get install -y ripgrep
        #   - os: macos-latest
        #     install-rg: brew update && brew install ripgrep

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.rev }}

      - name: Prepare
        run: |
          git clone --depth 1 https://github.com/nvim-treesitter/nvim-treesitter ./deps/nvim-treesitter
          git clone --depth 1 https://github.com/echasnovski/mini.nvim.git ./deps/mini.nvim

      - name: Run tests
        run: |
          nvim --version
          make test
